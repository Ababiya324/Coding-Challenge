<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }} - Grade Submissions</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1>{{ app_name }}</h1>
            <ul class="nav-links">
                <li><a href="/" class="active">Grade</a></li>
                <li><a href="/rubric-upload">Upload Rubric</a></li>
                <li><a href="/analytics">Analytics</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="grading-interface">
            <section class="card">
                <h2>Step 1: Select Exam & Rubric</h2>
                <div class="form-group">
                    <label for="exam-select">Select Exam:</label>
                    <select id="exam-select" class="form-control">
                        <option value="">Choose an exam...</option>
                        {% for exam in exams %}
                        <option value="{{ exam.id }}">{{ exam.exam_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div id="rubric-preview" class="rubric-preview" style="display: none;">
                    <h3>Rubric Preview</h3>
                    <div id="rubric-content"></div>
                </div>
            </section>

            <section class="card">
                <h2>Step 2: Upload Student Submission</h2>
                <div class="form-group">
                    <label for="student-id">Student ID:</label>
                    <input type="text" id="student-id" class="form-control" placeholder="e.g., student123">
                </div>

                <div class="form-group">
                    <label for="image-upload">Upload Exam Images:</label>
                    <input type="file" id="image-upload" class="form-control" multiple accept="image/*,application/pdf">
                    <small class="form-text">Upload images of the student's exam (one per question or all together)</small>
                </div>

                <div id="image-preview" class="image-preview"></div>

                <button id="grade-button" class="btn btn-primary btn-lg" disabled>
                    Grade Submission
                </button>
            </section>

            <section class="card" id="results-section" style="display: none;">
                <h2>Step 3: Results</h2>
                <div id="results-container"></div>
            </section>

            <div id="loading-overlay" class="loading-overlay" style="display: none;">
                <div class="spinner"></div>
                <p>Grading submission... This may take a minute.</p>
            </div>
        </div>
    </main>

    <script src="/static/js/app.js"></script>
    <script>
        // Initialize the grading page
        document.addEventListener('DOMContentLoaded', function() {
            initGradingPage();
        });
    </script>
</body>
</html>
